       it unasked, the rest are in icons/. Each comes in black (the plain name) and light (-light); the page is light

  <link rel="icon" href="./favicon-light.ico" sizes="16x16 32x32 48x48">

  <script>try { if (localStorage.getItem('heron.pond.theme') === 'dark') document.documentElement.classList.add('site-dark'); } catch { /* storage blocked */ }</script>
